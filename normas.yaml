    resumen: "Protocolo de interoperabilidad de BioAPI (BIP)."
    concepto: "BioAPI en red"
    pregunta: "¿Cómo uso BioAPI a través de la red?"
    descripcion: "Define el protocolo que permite usar la interfaz BioAPI entre sistemas distintos a través de la red, facilitando la interoperabilidad entre sistemas biométricos."
    ejemplo: "Un servidor central verifica huellas capturadas en lectores de varias sedes usando el protocolo BioAPI a través de la red."
    familia: bioapi
    alcance: norma
    categoria: biometria
    naturaleza: especificacion
    temas: [81, 84]
    claves:
      - "BIP: permite usar BioAPI entre equipos a través de la red."
