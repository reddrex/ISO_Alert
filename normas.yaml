  # --- Inteligencia artificial (ampliación: el temario no las cita) ---
  - codigo: ISO/IEC 22989
    nombre: "IA: conceptos y terminología"
    resumen: "Vocabulario y conceptos básicos de la inteligencia artificial."
    concepto: "vocabulario de la IA"
    pregunta: "¿Qué significa cada término de IA?"
    descripcion: "Define los términos y conceptos comunes de la inteligencia artificial (agente, modelo, aprendizaje automático, entrenamiento, inferencia, confiabilidad…) y describe el ecosistema y el ciclo de vida de un sistema de IA. Es la base terminológica del resto de normas del SC 42."
    ejemplo: "Un pliego para contratar un asistente conversacional remite a la ISO/IEC 22989 para dejar claro qué se entiende por «sistema de IA», «modelo» o «datos de entrenamiento»."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: vocabulario
    temas_relacionados: [71]
    claves:
      - "Es el «000» de la IA: el vocabulario común de las normas del SC 42."
    relaciones:
      - {tipo: vocabulario_de, norma: "ISO/IEC 42001"}

  - codigo: ISO/IEC 23053
    nombre: "IA: marco para sistemas de aprendizaje automático"
    resumen: "Marco de referencia de los sistemas de IA basados en aprendizaje automático."
    concepto: "marco del aprendizaje automático"
    pregunta: "¿De qué piezas se compone un sistema de aprendizaje automático?"
    descripcion: "Describe los componentes y funciones de un sistema de IA que usa aprendizaje automático: datos, modelo, entrenamiento, evaluación e inferencia, y los tipos de aprendizaje (supervisado, no supervisado, por refuerzo)."
    ejemplo: "El equipo de ciencia de datos de un ministerio documenta la arquitectura de su modelo de clasificación de expedientes siguiendo los componentes que describe la ISO/IEC 23053."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: modelo
    temas_relacionados: [71]
    claves:
      - "Junto con la 22989 es la base conceptual: la 22989 da los términos y la 23053 el marco del aprendizaje automático."
    relaciones:
      - {tipo: se_apoya_en, norma: "ISO/IEC 22989"}

  - codigo: ISO/IEC 42001
    nombre: "Sistema de gestión de la inteligencia artificial"
    resumen: "Requisitos de un sistema de gestión de la inteligencia artificial (SGIA)."
    concepto: "sistema de gestión de la IA"
    pregunta: "¿Cómo gestiono de forma responsable los sistemas de IA que desarrollo o uso?"
    descripcion: "Fija los requisitos para establecer, implantar, mantener y mejorar un sistema de gestión de la IA en organizaciones que desarrollan, ofrecen o usan sistemas de IA. Sigue la estructura armonizada de los sistemas de gestión, como la ISO/IEC 27001, e incluye un anexo de controles con su guía de aplicación."
    ejemplo: "Una empresa que ofrece a la Administración un servicio de análisis de imágenes con IA se certifica en la ISO/IEC 42001 para demostrar que gestiona sus riesgos, sus datos y su impacto."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: requisitos
    certificable: true
    temas_relacionados: [71]
    claves:
      - "Es la norma certificable de la IA, publicada en 2023: el «001» de la IA."
      - "Usa los 10 capítulos de la estructura armonizada, como la 9001 y la 27001, así que se puede integrar con ellas."
      - "Exige evaluar el impacto de los sistemas de IA; la ISO/IEC 42005 explica cómo hacerlo."
      - "Ayuda a organizar el cumplimiento del Reglamento europeo de IA (Reglamento (UE) 2024/1689), pero no es por sí sola una norma armonizada de ese Reglamento."
    relaciones:
      - {tipo: complementa, norma: "ISO/IEC 27001"}

  - codigo: ISO/IEC 42005
    nombre: "IA: evaluación de impacto de los sistemas de IA"
    resumen: "Guía para evaluar el impacto de un sistema de IA en las personas y la sociedad."
    concepto: "evaluación de impacto"
    pregunta: "¿Cómo evalúo el impacto de un sistema de IA en las personas?"
    descripcion: "Orienta sobre cómo y cuándo evaluar los efectos, positivos y negativos, que un sistema de IA puede tener en personas, grupos y la sociedad a lo largo de su ciclo de vida, y cómo documentarlos."
    ejemplo: "Antes de usar un modelo que prioriza solicitudes de ayudas, el organismo evalúa con la ISO/IEC 42005 si puede perjudicar a algún colectivo y qué medidas aplicar."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: guia
    temas_relacionados: [71]
    claves:
      - "Es a la IA lo que la evaluación de impacto en la privacidad (ISO/IEC 29134) es a los datos personales."
    relaciones:
      - {tipo: guia_de, norma: "ISO/IEC 42001"}
      - {tipo: complementa, norma: "ISO/IEC 29134"}

