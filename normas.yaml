    descripcion: "Establece conceptos, principios y requisitos relacionados con la medición del tamaño funcional del software."
    ejemplo: "Antes de elegir un método de medición, el organismo comprueba que es conforme con la ISO/IEC 14143, de modo que los tamaños medidos sean comparables."
