      - {tipo: audita, norma: "ISO/IEC 42001"}

  - codigo: ISO/IEC 23894
    nombre: "IA: gestión del riesgo"
    resumen: "Guía para gestionar los riesgos específicos de la inteligencia artificial."
    concepto: "riesgos de la IA"
    pregunta: "¿Cómo gestiono los riesgos propios de un sistema de IA?"
    descripcion: "Aplica los principios y el proceso de gestión del riesgo de la ISO 31000 a la inteligencia artificial, con los riesgos propios de estos sistemas, como el sesgo, la falta de transparencia o el comportamiento inesperado del modelo."
    ejemplo: "Al incorporar un modelo de detección de fraude, el equipo identifica y trata con la ISO/IEC 23894 el riesgo de falsos positivos que afecten a ciudadanos."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: guia
    temas_relacionados: [47, 71]
    claves:
      - "No es certificable: es una guía, como la ISO 31000 en la que se basa."
    relaciones:
      - {tipo: aplica, norma: "ISO 31000"}

  - codigo: ISO/IEC 38507
    nombre: "IA: gobierno del uso de la IA"
    resumen: "Implicaciones para el gobierno corporativo del uso de la IA."
    concepto: "gobierno de la IA"
    pregunta: "¿Qué debe decidir y supervisar la dirección cuando la organización usa IA?"
    descripcion: "Aplica el modelo de gobierno de la ISO/IEC 38500 (Evaluar-Dirigir-Supervisar) al uso de la inteligencia artificial: qué responsabilidades tiene el órgano de gobierno, qué políticas debe fijar y cómo supervisar el uso de la IA."
    ejemplo: "El comité de dirección de una agencia pública aprueba una política de uso de la IA que asigna responsables y fija cómo se revisan los sistemas en servicio, siguiendo la ISO/IEC 38507."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: guia
    temas_relacionados: [22]
    claves:
      - "Es de la familia 38500, como la 38505 para el dato: gobierno, no gestión."
    relaciones:
      - {tipo: aplica, norma: "ISO/IEC 38500"}

  - codigo: ISO/IEC 5338
    nombre: "IA: procesos del ciclo de vida de los sistemas de IA"
    resumen: "Procesos del ciclo de vida de los sistemas de IA."
    concepto: "ciclo de vida de la IA"
    pregunta: "¿Qué procesos sigue un sistema de IA desde su concepción hasta su retirada?"
    descripcion: "Adapta los procesos del ciclo de vida de sistemas (ISO/IEC/IEEE 15288) y de software (ISO/IEC/IEEE 12207) a los sistemas de IA, y añade procesos propios, como la adquisición y preparación de los datos o el seguimiento continuo del modelo en producción."
    ejemplo: "Un proyecto de MLOps define cómo se reentrena y se vuelve a validar un modelo cuando cambian los datos, apoyándose en los procesos de la ISO/IEC 5338."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: procesos
    temas_relacionados: [71, 86]
    claves:
      - "Parte de la 15288 y la 12207 y añade lo específico de la IA, como los datos y el reentrenamiento del modelo."
    relaciones:
      - {tipo: amplia, norma: "ISO/IEC/IEEE 15288"}
      - {tipo: amplia, norma: "ISO/IEC/IEEE 12207"}

  - codigo: ISO/IEC 8183
    nombre: "IA: marco del ciclo de vida de los datos"
    resumen: "Etapas del ciclo de vida de los datos en los sistemas de IA."
    concepto: "ciclo de vida de los datos"
    pregunta: "¿Por qué etapas pasan los datos de un sistema de IA?"
    descripcion: "Describe las etapas por las que pasan los datos en un sistema de IA y de análisis de datos, desde su concepción y adquisición hasta su preparación, uso para entrenar y evaluar, conservación y retirada."
    ejemplo: "La oficina del dato de un organismo documenta de dónde salen y cómo se preparan los datos de entrenamiento de un modelo, etapa a etapa, según la ISO/IEC 8183."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: modelo
    temas_relacionados: [71, 76]
    relaciones:
      - {tipo: complementa, norma: "ISO/IEC 5338"}

  - codigo: ISO/IEC 5259
    nombre: "IA: calidad de los datos para analítica y aprendizaje automático"
    resumen: "Serie sobre la calidad de los datos usados en analítica y aprendizaje automático."
    concepto: "calidad de los datos de entrenamiento"
    pregunta: "¿Cómo aseguro la calidad de los datos con los que se entrena un modelo?"
    descripcion: "Serie que adapta la calidad de los datos al aprendizaje automático: terminología, medidas de calidad, requisitos para gestionarla, un marco de procesos y otro de gobierno."
    ejemplo: "Antes de entrenar un modelo con datos de registros administrativos, el equipo mide su completitud, su representatividad y su etiquetado con las medidas de la ISO/IEC 5259-2."
    familia: ia
    alcance: serie
    categoria: ia
    naturaleza: modelo
    temas_relacionados: [71, 76]
    partes_descripcion:
      "1": "Visión general, terminología y ejemplos."
      "2": "Medidas de calidad de los datos."
      "3": "Requisitos y directrices para gestionar la calidad de los datos."
      "4": "Marco de procesos de calidad de los datos."
      "5": "Marco de gobierno de la calidad de los datos."
    claves:
      - "Lleva a la IA el modelo de calidad de los datos de la ISO/IEC 25012, con medidas propias, como la representatividad o la calidad del etiquetado."
    relaciones:
      - {tipo: amplia, norma: "ISO/IEC 25012"}

  - codigo: ISO/IEC 25059
    nombre: "IA: modelo de calidad de los sistemas de IA (SQuaRE)"
    resumen: "Modelo de calidad para sistemas de IA dentro de SQuaRE."
    concepto: "calidad de un sistema de IA"
    pregunta: "¿Qué características de calidad tiene un sistema de IA?"
    descripcion: "Adapta el modelo de calidad de la ISO/IEC 25010 a los sistemas de IA. Añade características y subcaracterísticas como la robustez, la transparencia, la controlabilidad por el usuario, la adaptabilidad funcional y la capacidad de intervención, y en la calidad en uso, la mitigación de riesgos sociales y éticos."
    ejemplo: "Al fijar los criterios de aceptación de un sistema de IA, el responsable de calidad añade a las características de la 25010 la robustez y la transparencia que define la ISO/IEC 25059."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: modelo
    temas_relacionados: [98]
    claves:
      - "Pertenece a SQuaRE (ISO/IEC 25000) aunque no a la decena de los modelos: amplía la 25010 para la IA."
    relaciones:
      - {tipo: amplia, norma: "ISO/IEC 25010"}

  - codigo: ISO/IEC TR 24028
    nombre: "IA: visión general de la confiabilidad"
    resumen: "Informe técnico sobre la confiabilidad (trustworthiness) de la IA."
    concepto: "confiabilidad"
    pregunta: "¿Qué hace que un sistema de IA sea digno de confianza?"
    descripcion: "Repasa qué hace confiable un sistema de IA (transparencia, explicabilidad, controlabilidad, robustez, seguridad, privacidad), las amenazas y vulnerabilidades que la debilitan y las medidas para reforzarla."
    ejemplo: "Para preparar la estrategia de IA de un organismo, el equipo usa la ISO/IEC TR 24028 como lista de aspectos de confianza que deben cubrir sus sistemas."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: informe
    temas_relacionados: [71]
    claves:
      - "Es un informe técnico (TR): informativo, no fija requisitos."
    relaciones:
      - {tipo: se_apoya_en, norma: "ISO/IEC 22989"}

  - codigo: ISO/IEC TR 24027
    nombre: "IA: sesgo en los sistemas de IA"
    resumen: "Informe técnico sobre el sesgo en los sistemas de IA y en las decisiones asistidas por IA."
    concepto: "sesgo"
    pregunta: "¿De dónde viene el sesgo de un sistema de IA y cómo se detecta?"
    descripcion: "Describe las fuentes de sesgo no deseado en los sistemas de IA (los datos, el diseño, el uso humano), cómo medirlo y técnicas para tratarlo a lo largo del ciclo de vida."
    ejemplo: "Un equipo comprueba con las métricas que recoge la ISO/IEC TR 24027 si su modelo de selección de candidatos acierta por igual con hombres y con mujeres."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: informe
    temas_relacionados: [71]
    relaciones:
      - {tipo: desarrolla, norma: "ISO/IEC TR 24028"}

  - codigo: ISO/IEC TS 6254
    nombre: "IA: explicabilidad e interpretabilidad"
    resumen: "Objetivos y enfoques para que los sistemas de aprendizaje automático sean explicables."
    concepto: "explicabilidad"
    pregunta: "¿Cómo explico por qué un modelo ha tomado una decisión?"
    descripcion: "Describe los objetivos de la explicabilidad y la interpretabilidad de los modelos de aprendizaje automático, a quién va dirigida cada explicación y los enfoques y métodos para conseguirla."
    ejemplo: "Para que un ciudadano entienda por qué se ha denegado su solicitud, el organismo elige con la ISO/IEC TS 6254 un método que muestre qué datos pesaron más en la decisión del modelo."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: especificacion
    temas_relacionados: [71]
    relaciones:
      - {tipo: desarrolla, norma: "ISO/IEC TR 24028"}

  - codigo: ISO/IEC 12792
    nombre: "IA: taxonomía de la transparencia"
    resumen: "Taxonomía de la información que hay que dar para que un sistema de IA sea transparente."
    concepto: "transparencia"
    pregunta: "¿Qué información debo dar sobre un sistema de IA para que sea transparente?"
    descripcion: "Clasifica los elementos de información que permiten que un sistema de IA sea transparente para sus distintas partes interesadas: su finalidad, sus datos, su funcionamiento, sus limitaciones y quién responde de él."
    ejemplo: "Un organismo publica una ficha de cada algoritmo que usa, con los apartados que propone la ISO/IEC 12792: finalidad, datos, funcionamiento y limitaciones."
    familia: ia
    alcance: norma
    categoria: ia
    naturaleza: modelo
    temas_relacionados: [71]
    relaciones:
      - {tipo: desarrolla, norma: "ISO/IEC TR 24028"}
