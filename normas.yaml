    ejemplo: "Un organismo que externaliza su servicio de atención al ciudadano exige al proveedor procesos de ciclo de vida conformes con la ISO/IEC 30105."
    alcance: serie
    categoria: servicios-ti
    naturaleza: procesos
    temas: [22]
    claves:
      - "Servicios habilitados por TI y externalización de procesos de negocio (ITES-BPO)."

