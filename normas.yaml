    resumen: "Evaluación del rendimiento de sistemas biométricos."
    concepto: "rendimiento y errores"
    pregunta: "¿Cómo mido los errores de un sistema biométrico?"
    descripcion: "Establece principios y métodos para medir y evaluar el rendimiento de sistemas biométricos."
    ejemplo: "Antes de desplegar puertas automáticas en aeropuertos, se prueba el sistema facial y se miden sus tasas de falso rechazo y falsa aceptación según la ISO/IEC 19795."
    alcance: serie
    categoria: biometria
    naturaleza: metodo
    temas: [81, 84]
    claves:
      - "Tasas de error: falsa aceptación (FMR/FAR) y falso rechazo (FNMR/FRR)."
  - codigo: ISO/IEC 24708
