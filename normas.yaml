normas:
  # --- Gobierno y calidad de datos ---
  - codigo: ISO 8000
    nombre: "Calidad de datos (datos maestros, de transacciones y de ingeniería)"
    resumen: "Familia de normas sobre calidad y gestión de datos."
    concepto: "calidad de datos maestros"
    pregunta: "¿Cómo aseguro la calidad de los datos maestros?"
    descripcion: "Aborda distintos aspectos de la calidad y gestión de datos, incluyendo datos maestros, intercambio de datos, metadatos y procesos relacionados con la calidad."
    alcance: serie
    partes_citadas: ["1", "2", "8", "60", "61", "62", "100-150", "311"]
    categoria: datos
    naturaleza: modelo
    temas: [71, 76]
    claves:
      - "Partes clave: 8 (conceptos y medición), 61 (modelo de procesos de gestión de la calidad de datos) y 100 a 150 (datos maestros)."
  - codigo: ISO/IEC 38505
    nombre: "Gobierno del dato"
    resumen: "Gobierno de datos."
    concepto: "gobierno del dato"
    pregunta: "¿Cómo gobierno los datos?"
    descripcion: "Familia relacionada con el gobierno de los datos dentro del marco general de gobierno de TI."
    familia: gobierno-ti
    alcance: serie
    partes_citadas: ["1", "TR 2"]
    categoria: datos
    naturaleza: guia
    temas: [71, 76]
    claves:
      - "Aplica el modelo de la ISO/IEC 38500 al gobierno del dato (parte 1); la parte 2 lo relaciona con la gestión de datos."
    relaciones:
      - {tipo: aplica, norma: "ISO/IEC 38500"}
  - codigo: ISO/IEC 25012
    nombre: "Modelo de calidad de datos"
    resumen: "Modelo de calidad de los datos."
    concepto: "calidad de los datos"
    pregunta: "¿Qué son datos de calidad?"
    descripcion: "Define características para describir y evaluar la calidad de los datos, como exactitud, completitud, consistencia, actualidad y accesibilidad."
    familia: square
    alcance: norma
    categoria: datos
    naturaleza: modelo
    temas: [28, 71, 76]
    claves:
      - "Quince características de calidad de los datos, clasificadas en inherentes y dependientes del sistema."
    relaciones:
      - {tipo: complementa, norma: "ISO 8000"}
  - codigo: ISO/IEC 25024
    nombre: "Medición de la calidad de los datos"
    resumen: "Medición de la calidad de los datos."
    concepto: "medir la calidad de los datos"
    pregunta: "¿Cómo mido la calidad de los datos?"
    descripcion: "Define medidas para cuantificar las características de calidad de los datos."
    familia: square
    alcance: norma
    categoria: datos
    naturaleza: metodo
    temas: [71, 76]
    claves:
      - "Medidas cuantitativas para las características de la ISO/IEC 25012."
    relaciones:
      - {tipo: mide, norma: "ISO/IEC 25012"}

  # --- Gobierno de TI ---
  - codigo: ISO/IEC 38500
    nombre: "Gobierno corporativo de las TI"
    resumen: "Gobierno corporativo de las tecnologías de la información."
    concepto: "gobierno de las TI"
    pregunta: "¿Cómo dirige la alta dirección el uso de las TI?"
    descripcion: "Proporciona principios y orientación para evaluar, dirigir y supervisar el uso actual y futuro de las TI."
    familia: gobierno-ti
    alcance: norma
    categoria: gobierno-ti
    naturaleza: guia
    temas: [22]
    claves:
      - "Distingue el gobierno de las TI (órgano de gobierno) de su gestión."
      - "Modelo Evaluar-Dirigir-Supervisar."
      - "Es una guía, no certificable."

  # --- Seguridad, privacidad, riesgos y continuidad ---
  - codigo: ISO/IEC 27000
    nombre: "SGSI: visión general y vocabulario"
    resumen: "Visión general y vocabulario de los sistemas de gestión de la seguridad de la información."
    concepto: "seguridad (vocabulario)"
    pregunta: "¿Qué significa cada término de la familia 27000?"
    descripcion: "Visión general de los sistemas de gestión de la seguridad de la información y términos y definiciones que usa toda la familia 27000."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
    naturaleza: vocabulario
    claves:
      - "Visión general y vocabulario de toda la familia; no contiene requisitos."
    relaciones:
      - {tipo: vocabulario_de, norma: "ISO/IEC 27001"}
  - codigo: ISO/IEC 27001
    nombre: "SGSI: requisitos"
    resumen: "Requisitos de un Sistema de Gestión de Seguridad de la Información (SGSI)."
    concepto: "sistema (SGSI)"
    pregunta: "¿Cómo gestiono la seguridad?"
    descripcion: "Define los requisitos para establecer, implementar, mantener y mejorar un SGSI basado en la gestión de riesgos de seguridad de la información."
    familia: iso-27000
    alcance: norma
    une: UNE-EN ISO/IEC 27001
    categoria: seguridad
    naturaleza: requisitos
    certificable: true
    temas: [38, 43, 47, 48, 71, 82, 105, 125]
    claves:
      - "Es la norma certificable de la familia 27000."
      - "Su Anexo A recoge los 93 controles de la ISO/IEC 27002:2022, agrupados en cuatro temas: organizativos, de personas, físicos y tecnológicos."
      - "Sigue la estructura armonizada de los sistemas de gestión (cláusulas 4 a 10, ciclo de mejora continua)."
      - "La modificación Amd 1:2024 añade la consideración del cambio climático."
  - codigo: ISO/IEC 27002
    nombre: "Controles de seguridad de la información (buenas prácticas)"
    resumen: "Guía de controles de seguridad de la información."
    concepto: "controles"
    pregunta: "¿Qué controles puedo aplicar?"
    descripcion: "Proporciona un catálogo de controles y buenas prácticas para tratar riesgos de seguridad de la información."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
    naturaleza: guia
    temas: [38, 47, 71, 82, 125]
    claves:
      - "No es certificable: es una guía de controles."
      - "Edición de 2022: 93 controles en cuatro temas (37 organizativos, 8 de personas, 14 físicos y 34 tecnológicos), frente a los 114 controles en 14 dominios de la edición de 2013."
    relaciones:
      - {tipo: desarrolla, norma: "ISO/IEC 27001"}
  - codigo: ISO/IEC 27005
    nombre: "Gestión de riesgos de seguridad de la información"
    resumen: "Gestión de riesgos de seguridad de la información."
    concepto: "riesgos"
    pregunta: "¿Cómo gestiono los riesgos?"
    descripcion: "Proporciona orientación para aplicar la gestión de riesgos específicamente al ámbito de la seguridad de la información."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
    naturaleza: guia
    temas: [47, 82]
    claves:
      - "Guía, no certificable."
      - "Aplica el proceso de la ISO 31000 a la seguridad de la información: identificación, análisis, evaluación y tratamiento del riesgo."
    relaciones:
      - {tipo: desarrolla, norma: "ISO/IEC 27001"}
      - {tipo: se_apoya_en, norma: "ISO 31000"}
      - {tipo: sustituye, norma: "ISO/IEC 13335"}
  - codigo: ISO/IEC 27017
    nombre: "Controles de seguridad para servicios en la nube"
    resumen: "Controles de seguridad para servicios cloud."
    concepto: "cloud"
    pregunta: "¿Cómo adapto los controles al cloud?"
    descripcion: "Proporciona controles y orientación específicos para la seguridad de servicios en la nube."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
    naturaleza: guia
    temas: [125]
    claves:
      - "Parte de la ISO/IEC 27002 y añade orientaciones para el proveedor y para el cliente de servicios en la nube."
    relaciones:
      - {tipo: amplia, norma: "ISO/IEC 27002"}
  - codigo: ISO/IEC 27018
    nombre: "Protección de datos personales (PII) en nube pública"
    resumen: "Protección de información personal en nubes públicas."
    concepto: "PII en cloud"
    pregunta: "¿Cómo protejo los datos personales en la nube pública?"
    descripcion: "Proporciona controles y buenas prácticas para proteger información personal identificable procesada en servicios de nube pública."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
    naturaleza: guia
    temas: [71, 125]
    claves:
      - "Se aplica cuando el proveedor de nube pública actúa como encargado del tratamiento de datos personales."
    relaciones:
      - {tipo: amplia, norma: "ISO/IEC 27002"}
  - codigo: ISO/IEC 27701
    nombre: "Sistema de gestión de la privacidad de la información (SGPI)"
    resumen: "Sistema de gestión de información de privacidad."
    concepto: "privacidad (SGPI)"
    pregunta: "¿Cómo gestiono la privacidad?"
    descripcion: "Extiende el enfoque de los sistemas de gestión de seguridad de la información hacia la gestión de la privacidad y la información personal."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
    naturaleza: requisitos
    certificable: true
    temas: [71, 76, 82]
    claves:
      - "Sistema de gestión de la privacidad de la información (SGPI) para responsables y encargados del tratamiento."
      - "Desde la edición de 2025 es una norma de sistema de gestión independiente y certificable por sí misma; antes era una extensión de la ISO/IEC 27001."
    relaciones:
