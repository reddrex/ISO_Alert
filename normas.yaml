      - {tipo: encapsula, norma: "ISO/IEC 39794"}
  - codigo: ISO/IEC 19794
    nombre: "Formatos de intercambio de datos biométricos (huella, rostro, iris…)"
    resumen: "Formatos de intercambio de datos biométricos."
    concepto: "formatos por modalidad"
    pregunta: "¿Cómo se codifica una huella o una cara?"
    descripcion: "Define formatos normalizados para representar y almacenar distintos tipos de datos biométricos."
    ejemplo: "La imagen facial del pasaporte electrónico se guarda en el chip con el formato normalizado de la ISO/IEC 19794-5, para que cualquier país pueda leerla."
    familia: formatos-biometricos
    alcance: serie
    categoria: biometria
    contexto: "Se vigila también su sucesora, la serie ISO/IEC 39794"
    naturaleza: especificacion
    temas: [81, 84]
    claves:
      - "Una parte por modalidad: huella (minucias, imagen, patrón), cara, iris, firma, venas…"
      - "Se sustituye progresivamente por la ISO/IEC 39794."
  - codigo: ISO/IEC 39794
    nombre: "Formatos extensibles de intercambio de datos biométricos"
    resumen: "Formatos extensibles de intercambio de datos biométricos."
    concepto: "formatos extensibles"
    pregunta: "¿Cuál es la nueva generación de formatos biométricos?"
    descripcion: "Nueva generación de formatos de intercambio biométrico, extensibles y con codificación ASN.1 y XML, que sustituye a la ISO/IEC 19794. Es la base de la nueva generación de pasaportes electrónicos de la OACI."
    ejemplo: "Los nuevos pasaportes electrónicos migran el formato de la imagen facial y las huellas a la ISO/IEC 39794, que admite añadir información sin romper la compatibilidad."
    familia: formatos-biometricos
    alcance: serie
    categoria: biometria
    contexto: "No la cita el temario; se añade por ser la nueva generación de la ISO/IEC 19794"
    naturaleza: especificacion
    temas: [81, 84]
    claves:
      - "Formatos extensibles con codificación ASN.1 y XML."
      - "Base de la nueva generación de pasaportes electrónicos de la OACI."
    relaciones:
      - {tipo: sustituye, norma: "ISO/IEC 19794"}
  - codigo: ISO/IEC 19795
