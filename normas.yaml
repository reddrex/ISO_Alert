# Normas vigiladas — extraídas del temario y validadas contra ISO Open Data
# el 2026-09-27 (ver data/validacion.json).
#
# Campos de cada norma:
#   codigo          identificador ISO sin año (lo que se busca en el dataset)
#   nombre          nombre descriptivo en español para la web (el título oficial sale del dataset ISO)
#   resumen         qué es, en una línea
#   concepto        palabra clave para recordarla dentro de su familia (27001 = sistema, 27002 = controles…)
#   pregunta        pregunta que responde la norma
#   descripcion     para qué sirve, en 1-3 frases
#   ejemplo         situación concreta en la que se aplica la norma
#   naturaleza      requisitos | vocabulario | guia | modelo | procesos | metodo | especificacion | informe
#   certificable    true si una organización puede certificarse con ella (o con su parte 1)
#   temas           números de los temas del temario que la citan (ver temario.yaml)
#   claves          datos que conviene recordar para el examen
#   relaciones      {tipo, norma}: relación con otra norma vigilada (la inversa se muestra sola)
#   partes_descripcion  texto de las partes que el temario cita por separado
#   alcance         norma = solo ese documento | serie = todas sus partes (-1, -2…)
#   familia         id de la familia o grupo de estudio al que pertenece (ver bloque "familias")
#   partes_citadas  partes que menciona el temario (informativo)
#   edicion_citada  año de la edición que cita el temario
#   une             código UNE cuando el temario lo cita
#   categoria       id de la categoría (ver bloque "categorias"), para filtrar en la web
#   contexto        nota para humanos
#   revisar         duda pendiente; se borra al resolverla
#
# Familias y grupos: normas con números distintos que se estudian juntas. Solo agrupan
# y dan nombre en la web (vista "Por ámbito"): NO amplían lo que se vigila.
#   tipo         familia = la define ISO con su numeración (27000, SQuaRE, 9000…)
#                grupo   = la formamos nosotros por tema (ciclo de vida, conservación…)
#   corto        nombre que se muestra en el mapa y la tabla; "nombre", el completo
#   categoria    categoría y, con ella, área del mapa en la que aparece
#   descripcion  introducción de su página
# Las normas antecesoras van con sus sucesoras. Su estado (sustituida, anulada…) sale
# de los datos de ISO: no se escribe en "nombre" ni en "concepto".
# Las categorías aparecen en los filtros de la web en el orden de este fichero.

familias:
  # --- seguridad ---
  - id: iso-27000
    tipo: familia
    nombre: "Familia ISO/IEC 27000 — Seguridad de la información"
    corto: "ISO/IEC 27000"
    categoria: seguridad
    descripcion: "Las normas ISO/IEC de seguridad de la información: el vocabulario común (27000), los requisitos del sistema de gestión de la seguridad de la información o SGSI (27001, la certificable), el catálogo de controles (27002), la gestión de riesgos (27005) y normas para ámbitos concretos, como la nube (27017 y 27018) y la privacidad (27701). La serie ISO/IEC 13335 es su antecesora."
    temas: [38, 43, 47, 48, 71, 82, 125]
  - id: privacidad-29100
    tipo: grupo
    nombre: "Privacidad: marco ISO/IEC 29100 y normas relacionadas"
    corto: "Privacidad"
    categoria: seguridad
    descripcion: "El marco de privacidad de la ISO/IEC 29100 fija la terminología y los principios, y otras normas lo desarrollan: controles para proteger datos personales (29151), evaluación de impacto en la privacidad (29134), técnicas de desidentificación (20889) y privacidad desde el diseño en productos de consumo (31700). Ayudan a cumplir obligaciones como las del RGPD, pero no sustituyen a la norma legal."
  - id: riesgo-continuidad
    tipo: grupo
    nombre: "Gestión del riesgo y continuidad del negocio"
    corto: "Riesgo y continuidad"
    categoria: seguridad
    descripcion: "La ISO 31000 da directrices generales para gestionar cualquier tipo de riesgo y no es certificable; normas sectoriales como la ISO/IEC 27005 se apoyan en ella. La ISO 22301 fija los requisitos de un sistema de gestión de la continuidad del negocio (SGCN), certificable, para seguir prestando los servicios críticos ante una interrupción."
  - id: common-criteria
    tipo: grupo
    nombre: "Common Criteria (ISO/IEC 15408) y su metodología de evaluación (ISO/IEC 18045)"
    corto: "Common Criteria"
    categoria: seguridad
    descripcion: "Esquema internacional para evaluar y certificar la seguridad de productos TIC. La ISO/IEC 15408 define los requisitos funcionales y de garantía, con los niveles de garantía de evaluación (EAL), y la ISO/IEC 18045 (CEM) la metodología que siguen los laboratorios de evaluación. En España lo aplica el Organismo de Certificación del Centro Criptológico Nacional."
  # --- gobierno-ti ---
  - id: gobierno-ti
    tipo: familia
    nombre: "Familia ISO/IEC 38500 — Gobierno de las TI y del dato"
    corto: "ISO/IEC 38500"
    categoria: gobierno-ti
    descripcion: "Gobierno corporativo de las TI: cómo el órgano de gobierno de la organización evalúa, dirige y supervisa el uso de la tecnología, algo distinto de su gestión diaria. La ISO/IEC 38500 fija los principios y el modelo Evaluar-Dirigir-Supervisar; la ISO/IEC 38505 los aplica al gobierno del dato."
  # --- ingenieria-software ---
  - id: ciclo-vida
    tipo: grupo
    nombre: "Procesos del ciclo de vida de sistemas y software"
    corto: "Ciclo de vida"
    categoria: ingenieria-software
    descripcion: "Normas de ISO/IEC y el IEEE que definen los procesos para adquirir, desarrollar, operar, mantener y retirar sistemas (15288) y software (12207). Las otras dos las complementan: qué documentación produce cada proceso (15289) y cómo se realiza el mantenimiento del software (14764)."
  - id: requisitos
    tipo: grupo
    nombre: "Ingeniería de requisitos"
    corto: "Requisitos"
    categoria: ingenieria-software
    descripcion: "La ISO/IEC/IEEE 29148 describe los procesos de ingeniería de requisitos y el contenido de sus documentos, como la especificación de requisitos software. La ISO/IEC TR 24766 orienta sobre las capacidades que deben ofrecer las herramientas que dan soporte a esos procesos."
  - id: iso-33000
    tipo: familia
    nombre: "Familia ISO/IEC 330xx — Evaluación de procesos"
    corto: "ISO/IEC 330xx"
    categoria: ingenieria-software
    descripcion: "Las normas ISO/IEC para evaluar la capacidad de los procesos de una organización: los conceptos y la terminología (33001), los requisitos para que una evaluación sea fiable (33002) y modelos de evaluación para procesos concretos, como las pruebas de software (33063). Sustituyó a la ISO/IEC 15504, conocida como SPICE."
    temas: [71, 76, 96, 98]
  # --- calidad-software ---
  - id: square
    tipo: familia
    nombre: "Familia SQuaRE (ISO/IEC 25000) — Calidad de sistemas y software"
    corto: "SQuaRE"
    categoria: calidad-software
    descripcion: "SQuaRE (Systems and software Quality Requirements and Evaluation) es la familia ISO/IEC 25000 para especificar, medir y evaluar la calidad del software y de los datos. Se organiza en divisiones: gestión de la calidad (2500n, con la guía 25000), modelos de calidad (2501n: 25010 para el producto y 25012 para los datos), medición (2502n: 25024), requisitos (2503n) y evaluación (2504n: 25040). Sustituyó a la ISO/IEC 9126 y a casi toda la ISO/IEC 14598, de la que solo sigue en vigor la parte 6."
    temas: [28, 44, 91, 96]
  # --- metricas ---
  - id: tamano-funcional
    tipo: grupo
    nombre: "Medición del tamaño funcional del software (marco y métodos)"
    corto: "Tamaño funcional"
    categoria: metricas
    descripcion: "Medir el tamaño funcional es cuantificar la funcionalidad que el software entrega al usuario, con independencia de la tecnología con que se construya. La ISO/IEC 14143 define los conceptos y cuándo un método es conforme; los métodos concretos son normas aparte: COSMIC (19761), IFPUG (20926) y NESMA (24570), estos dos últimos basados en el análisis de puntos de función."
  # --- calidad ---
  - id: iso-9000
    tipo: familia
    nombre: "Familia ISO 9000 — Gestión de la calidad"
    corto: "ISO 9000"
    categoria: calidad
    descripcion: "Las normas ISO de gestión de la calidad: los fundamentos y el vocabulario (9000), los requisitos del sistema de gestión de la calidad (9001, la única certificable) y las directrices para el éxito sostenido de la organización (9004). La ISO 9003 es una norma antigua de la familia que se integró en la ISO 9001 en el año 2000."
    temas: [22, 35, 38, 103]
  # --- biometria ---
  - id: bioapi
    tipo: grupo
    nombre: "BioAPI — Interfaz biométrica y normas asociadas"
    corto: "BioAPI"
    categoria: biometria
    descripcion: "BioAPI es una interfaz de programación normalizada para que las aplicaciones usen sensores y algoritmos biométricos de distintos fabricantes sin depender de ninguno. La ISO/IEC 19784 define la interfaz, la ISO/IEC 24708 el protocolo para usarla a través de la red y la ISO/IEC 24709 las pruebas de conformidad."
  - id: formatos-biometricos
    tipo: grupo
    nombre: "Formatos de intercambio de datos biométricos"
    corto: "Formatos biométricos"
    categoria: biometria
    descripcion: "Cómo se codifican y empaquetan los datos biométricos para intercambiarlos entre sistemas de distintos fabricantes. La ISO/IEC 19794 define un formato por modalidad (huella, cara, iris…) y la ISO/IEC 39794 es su nueva generación, extensible, que la está sustituyendo, por ejemplo en los pasaportes electrónicos. La ISO/IEC 19785 (CBEFF) define la estructura común que envuelve esos datos con sus metadatos."
  # --- bd-comercio ---
  - id: sql
    tipo: grupo
    nombre: "Lenguaje de bases de datos SQL"
    corto: "SQL"
    categoria: bd-comercio
    descripcion: "La ISO/IEC 9075 es la norma del lenguaje SQL, dividida en partes. La ISO/IEC 13249 (SQL/MM) define, sobre SQL, paquetes de tipos y funciones para datos multimedia y de aplicación: texto completo, datos espaciales, imágenes fijas y minería de datos."
  - id: edi
    tipo: grupo
    nombre: "Intercambio electrónico de datos comerciales (EDI)"
    corto: "EDI"
    categoria: bd-comercio
    descripcion: "Normas de Naciones Unidas (UN/CEFACT) adoptadas por ISO para el intercambio electrónico de datos entre empresas y administraciones. La ISO 9735 fija la sintaxis de los mensajes UN/EDIFACT y la ISO 7372 el directorio de elementos de datos comerciales (UNTDED) que esos mensajes utilizan."
  # --- documental ---
  - id: gestion-documentos
    tipo: grupo
    nombre: "Gestión de documentos: principios y procesos"
    corto: "Gestión de documentos"
    categoria: documental
    descripcion: "Normas del comité ISO/TC 46/SC 11 sobre los procesos de gestión de documentos. La ISO 15489 es la norma básica (conceptos y principios); la ISO 23081 trata los metadatos de los documentos, la ISO/TR 26122 el análisis de los procesos de trabajo que los generan y la ISO/TR 13028 la digitalización. Son referencia habitual de las Normas Técnicas de Interoperabilidad sobre documento electrónico."
  - id: iso-30300
    tipo: familia
    nombre: "Familia ISO 30300 — Sistemas de gestión para los documentos"
    corto: "ISO 30300"
    categoria: documental
    descripcion: "Aplica el modelo de los sistemas de gestión (el mismo de la ISO 9001 o la ISO/IEC 27001) a los documentos de una organización: los fundamentos y el vocabulario (30300), los requisitos, certificables (30301), y la guía de implantación (30302). Se apoya en los principios de gestión de documentos de la ISO 15489."
    temas: [46, 104]
  - id: conservacion
    tipo: grupo
    nombre: "Conservación a largo plazo de la información digital"
    corto: "Conservación"
    categoria: documental
    descripcion: "Cómo mantener los documentos electrónicos legibles, auténticos y fiables durante décadas. La ISO 14721 (OAIS) es el modelo de referencia de un archivo digital; la ISO 19005 (PDF/A), el formato de fichero para conservación; la ISO/TR 18492 da orientaciones prácticas, y la ISO 15801, los requisitos para que la información almacenada electrónicamente sea fiable. La ISO 26102, que cita el temario, fue un proyecto que se canceló sin llegar a publicarse."
  # --- usabilidad ---
  - id: ergonomia
    tipo: familia
    nombre: "Serie ISO 9241 — Ergonomía de la interacción persona-sistema"
    corto: "ISO 9241"
    categoria: usabilidad
    descripcion: "La serie ISO 9241 reúne en un solo número, dividido en muchas partes, las normas de ergonomía de la interacción entre personas y sistemas: diálogo, presentación de la información, pantallas, usabilidad… Su parte 11 define la usabilidad y la parte 210 el diseño centrado en las personas, que sustituyó a la ISO 13407; los requisitos de pantallas planas de la ISO 13406 pasaron a las partes 300."
  - id: interfaces
    tipo: grupo
    nombre: "Interfaces de usuario"
    corto: "Interfaces de usuario"
    categoria: usabilidad
    descripcion: "Normas del comité ISO/IEC JTC 1/SC 35 sobre elementos concretos de la interfaz de usuario: el control del cursor en el diálogo (ISO/IEC 10741) y los iconos (ISO/IEC 11581)."
  # --- iot ---
  - id: iot
    tipo: grupo
    nombre: "Internet de las cosas (IoT)"
    corto: "IoT"
    categoria: iot
    descripcion: "Normas del comité ISO/IEC JTC 1/SC 41 sobre Internet de las cosas: vocabulario común (20924, que desde 2024 incluye los gemelos digitales), arquitectura de referencia (30141) e interoperabilidad entre sistemas IoT (21823)."
  # --- ia ---
  - id: ia
    tipo: grupo
    nombre: "Inteligencia artificial (ISO/IEC JTC 1/SC 42)"
    corto: "Normas de IA"
    categoria: ia
    descripcion: "Normas del comité ISO/IEC JTC 1/SC 42 sobre inteligencia artificial. El temario no las cita: son de ampliación, por su relación con la ciencia de datos (tema 71). La base es el vocabulario (22989) y el marco de los sistemas de aprendizaje automático (23053). Sobre ella se construye el sistema de gestión de la IA (42001, certificable), con su evaluación de impacto (42005), los requisitos de quien lo certifica (42006), la gestión del riesgo (23894) y el gobierno por la dirección (38507). Otras normas tratan el ciclo de vida (5338), los datos (8183 y la serie 5259), la calidad del sistema (25059) y su confiabilidad: sesgo, explicabilidad y transparencia."

