    descripcion: "Especifica COSMIC, método de medición del tamaño funcional basado en movimientos de datos a través de los límites del sistema."
    ejemplo: "Para estimar el esfuerzo de un sistema de control de semáforos, se mide su tamaño funcional contando los movimientos de datos con COSMIC."
