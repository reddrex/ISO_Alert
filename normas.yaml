      - {tipo: complementa, norma: "ISO/IEC 20926"}

  # --- Gestión de servicios de TI ---
  - codigo: ISO/IEC 20000
    nombre: "Gestión de servicios de TI"
    resumen: "Serie de normas de gestión de servicios de TI."
    concepto: "servicios de TI (SGS)"
    pregunta: "¿Cómo gestiono los servicios de TI?"
    descripcion: "Establece un marco para planificar, diseñar, prestar, gestionar, controlar y mejorar servicios de tecnologías de la información."
    ejemplo: "El centro de servicios de una administración organiza la gestión de incidencias, cambios y acuerdos de nivel de servicio y obtiene la certificación ISO/IEC 20000-1."
    alcance: serie
    partes_citadas: ["1", "2", "3", "5"]
    categoria: servicios-ti
    naturaleza: requisitos
    certificable: true
    temas: [22, 106]
    claves:
      - "La parte 1 es certificable: requisitos del sistema de gestión del servicio (SGS)."
      - "Alineada con las buenas prácticas de ITIL."
    partes_descripcion:
      "1": "Requisitos de un sistema de gestión de servicios de TI. Define los requisitos para establecer, implementar, mantener y mejorar un sistema de gestión de servicios."
      "2": "Guía para la aplicación de un sistema de gestión de servicios. Proporciona orientación práctica para interpretar y aplicar los requisitos de ISO/IEC 20000-1."
      "3": "Guía sobre el alcance y aplicabilidad de ISO/IEC 20000-1. Ayuda a determinar el alcance de un sistema de gestión de servicios y la aplicabilidad de sus requisitos."
      "5": "Guía de implementación de un sistema de gestión de servicios. Proporciona orientación para planificar y ejecutar la implantación de un sistema de gestión de servicios."
