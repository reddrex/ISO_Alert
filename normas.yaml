normas:
  # --- Gobierno y calidad de datos ---
  - codigo: ISO 8000
    nombre: "Calidad de datos (datos maestros, de transacciones y de ingeniería)"
    descripcion: "Serie sobre la calidad de los datos y de la información: conceptos y medición (parte 8), gestión de la calidad de datos con un modelo de referencia de procesos y la evaluación de la madurez (partes 60 a 62) y calidad de los datos maestros y su intercambio (partes 100 a 150)."
    alcance: serie
    partes_citadas: ["1", "2", "8", "60", "61", "62", "100-150", "311"]
    categoria: datos
  - codigo: ISO/IEC 38505
    nombre: "Gobierno del dato"
    descripcion: "Aplica los principios y el modelo de la ISO/IEC 38500 al gobierno del dato: cómo el órgano de gobierno supervisa el valor, los riesgos y las restricciones del uso de los datos (parte 1). La parte 2 relaciona ese gobierno con la gestión de datos."
    familia: gobierno-ti
    alcance: serie
    partes_citadas: ["1", "TR 2"]
    categoria: datos
  - codigo: ISO/IEC 25012
    nombre: "Modelo de calidad de datos"
    descripcion: "Modelo de calidad de los datos: define 15 características (exactitud, completitud, consistencia, actualidad…), clasificadas según sean inherentes a los datos o dependan del sistema."
    familia: square
    alcance: norma
    categoria: datos
  - codigo: ISO/IEC 25024
    nombre: "Medición de la calidad de los datos"
    descripcion: "Define medidas para evaluar de forma cuantitativa las características del modelo de calidad de datos de la ISO/IEC 25012."
    familia: square
    alcance: norma
    categoria: datos

  # --- Gobierno de TI ---
  - codigo: ISO/IEC 38500
    nombre: "Gobierno corporativo de las TI"
    descripcion: "Principios para que el órgano de gobierno (consejo de administración, alta dirección) evalúe, dirija y supervise el uso de las TI en la organización. Distingue el gobierno de las TI de su gestión. Es una guía, no certificable."
    familia: gobierno-ti
    alcance: norma
    categoria: gobierno-ti

  # --- Seguridad, privacidad, riesgos y continuidad ---
  - codigo: ISO/IEC 27000
    nombre: "SGSI: visión general y vocabulario"
    descripcion: "Visión general de los sistemas de gestión de la seguridad de la información y términos y definiciones que usa toda la familia 27000."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 27001
    nombre: "SGSI: requisitos"
    descripcion: "Requisitos para establecer, implantar, mantener y mejorar un SGSI. Es la norma certificable de la familia. Su Anexo A enumera los 93 controles de referencia de la ISO/IEC 27002:2022. La modificación de 2024 añade la consideración del cambio climático."
    familia: iso-27000
    alcance: norma
    une: UNE-EN ISO/IEC 27001
    categoria: seguridad
  - codigo: ISO/IEC 27002
    nombre: "Controles de seguridad de la información (buenas prácticas)"
    descripcion: "Guía de buenas prácticas con los controles de seguridad de la información (93 en la edición de 2022, agrupados en organizativos, de personas, físicos y tecnológicos) y cómo implantarlos. No es certificable."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 27005
    nombre: "Gestión de riesgos de seguridad de la información"
    descripcion: "Guía para gestionar los riesgos de seguridad de la información dentro de un SGSI: identificación, análisis, evaluación y tratamiento del riesgo. Se apoya en la ISO 31000."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 27017
    nombre: "Controles de seguridad para servicios en la nube"
    descripcion: "Controles de seguridad para servicios en la nube basados en la ISO/IEC 27002, con orientaciones tanto para el proveedor como para el cliente del servicio."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 27018
    nombre: "Protección de datos personales (PII) en nube pública"
    descripcion: "Guía para proteger los datos personales en nubes públicas cuando el proveedor actúa como encargado del tratamiento."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 27701
    nombre: "Sistema de gestión de la privacidad de la información (SGPI)"
    descripcion: "Requisitos y orientaciones para un sistema de gestión de la privacidad de la información (SGPI), aplicable a responsables y encargados del tratamiento de datos personales. Desde la edición de 2025 es una norma de sistema de gestión independiente de la ISO/IEC 27001 y certificable por sí misma."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 29100
    nombre: "Marco de privacidad"
    descripcion: "Marco común de privacidad para los sistemas TIC que tratan datos personales: terminología, actores y sus funciones, y principios de privacidad."
    familia: privacidad-29100
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 29151
    nombre: "Código de prácticas para la protección de datos personales"
    descripcion: "Controles y orientaciones para proteger los datos personales, que amplían los de la ISO/IEC 27002 con los específicos de privacidad."
    familia: privacidad-29100
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 29134
    nombre: "Evaluación de impacto en la privacidad"
    descripcion: "Guía para realizar evaluaciones de impacto en la privacidad (EIPD): proceso y estructura del informe."
    familia: privacidad-29100
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 20889
    nombre: "Técnicas de desidentificación de datos"
    descripcion: "Terminología y clasificación de las técnicas de desidentificación de datos (seudonimización, generalización, aleatorización…) y de sus propiedades."
    familia: privacidad-29100
    alcance: norma
    categoria: seguridad
  - codigo: ISO 31700
    nombre: "Privacidad desde el diseño para bienes y servicios de consumo"
    descripcion: "Requisitos de alto nivel de privacidad desde el diseño para bienes y servicios de consumo que tratan datos personales (parte 1), con casos de uso (parte 2)."
    familia: privacidad-29100
    alcance: serie
    categoria: seguridad
    contexto: "El temario la cita como ISO/DIS 31700 (borrador); se publicó en 2023 como ISO 31700-1 e ISO/TR 31700-2"
  - codigo: ISO/IEC 29115
    nombre: "Garantía de autenticación de entidades (niveles de identificación electrónica)"
    descripcion: "Marco de garantía de la autenticación de entidades: define cuatro niveles de garantía (LoA 1 a 4) y los criterios y amenazas de cada fase del proceso de identificación y autenticación."
    alcance: norma
    categoria: seguridad
    contexto: "El temario la cita como ISO 29115"
  - codigo: ISO/IEC 15408
    nombre: "Common Criteria: criterios de evaluación de la seguridad TI"
    descripcion: "Criterios Comunes (Common Criteria) para evaluar la seguridad de productos TIC: modelo general (parte 1), componentes funcionales de seguridad (parte 2) y componentes de garantía, con los niveles EAL (parte 3)."
    familia: common-criteria
    alcance: serie
    partes_citadas: ["1", "2", "3"]
    categoria: seguridad
  - codigo: ISO/IEC 18045
    nombre: "CEM: metodología de evaluación de la seguridad TI"
    descripcion: "Metodología común de evaluación (CEM): cómo deben realizar los laboratorios la evaluación de seguridad según la ISO/IEC 15408."
    familia: common-criteria
    alcance: norma
    categoria: seguridad
  - codigo: ISO/IEC 13335
    nombre: "Gestión de la seguridad de las TIC (serie antigua)"
    descripcion: "Antigua serie de directrices para gestionar la seguridad de las TIC (conceptos, planificación, técnicas y selección de salvaguardas). Está anulada: sus contenidos pasaron sobre todo a la ISO/IEC 27005 y a la ISO/IEC 27033-1 (seguridad de redes)."
    familia: iso-27000
    alcance: serie
    partes_citadas: ["1", "2", "3", "4", "5"]
    categoria: seguridad
    contexto: "Serie anulada; sus contenidos pasaron a ISO/IEC 27005 e ISO/IEC 27033-1"
  - codigo: ISO 31000
    nombre: "Gestión del riesgo: directrices"
    descripcion: "Directrices para gestionar cualquier tipo de riesgo en cualquier organización: principios, marco de referencia y proceso de gestión del riesgo. No es certificable."
    familia: riesgo-continuidad
    alcance: norma
    categoria: seguridad
  - codigo: ISO 22301
    nombre: "Sistema de gestión de la continuidad del negocio (SGCN)"
    descripcion: "Requisitos de un sistema de gestión de la continuidad del negocio (SGCN) para prepararse ante interrupciones, responder a ellas y recuperarse. Es certificable."
    familia: riesgo-continuidad
    alcance: norma
    edicion_citada: "2012"
    categoria: seguridad
  - codigo: ISO/IEC 17065
    nombre: "Requisitos para organismos que certifican productos, procesos y servicios"
    descripcion: "Requisitos para los organismos que certifican productos, procesos y servicios. Es la norma con la que ENAC acredita, por ejemplo, a las entidades que certifican la conformidad con el ENS."
    alcance: norma
    une: UNE-EN ISO/IEC 17065
    categoria: seguridad
    contexto: "Acreditación por ENAC de entidades certificadoras del ENS"

  # --- Ingeniería de software y ciclo de vida ---
  - codigo: ISO/IEC/IEEE 12207
    nombre: "Procesos del ciclo de vida del software"
    descripcion: "Procesos del ciclo de vida del software (de acuerdo, organizativos, de gestión técnica y técnicos), desde la concepción hasta la retirada. Comparte estructura con la ISO/IEC/IEEE 15288."
    familia: ciclo-vida
    alcance: norma
    edicion_citada: "2017"
    categoria: ingenieria-software
  - codigo: ISO/IEC/IEEE 15288
    nombre: "Procesos del ciclo de vida de los sistemas"
    descripcion: "Procesos del ciclo de vida de los sistemas, formados por hardware, software, personas y procedimientos. Es la norma de referencia de la que deriva la estructura de la 12207."
    familia: ciclo-vida
    alcance: norma
    categoria: ingenieria-software
  - codigo: ISO/IEC/IEEE 15289
    nombre: "Contenido de la documentación del ciclo de vida"
