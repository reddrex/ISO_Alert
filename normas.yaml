    resumen: "Método NESMA de puntos de función."
    concepto: "NESMA"
    pregunta: "¿Cómo estimo pronto el tamaño con puntos de función?"
    descripcion: "Recoge el método NESMA para la medición del tamaño funcional mediante puntos de función."
