    resumen: "BioAPI."
    concepto: "BioAPI"
    pregunta: "¿Cómo usa una aplicación un sensor biométrico?"
    descripcion: "Define interfaces y elementos para facilitar la interoperabilidad entre aplicaciones y tecnologías biométricas."
    ejemplo: "Una aplicación de control de acceso puede cambiar de lector de huellas sin reprogramarse porque ambos lectores ofrecen la interfaz BioAPI."
