    pregunta: "¿Qué significa cada término de biometría?"
    descripcion: "Establece conceptos y terminología comunes relacionados con la biometría."
    ejemplo: "En un informe técnico sobre control de fronteras se distingue correctamente entre verificación (¿eres quien dices ser?) e identificación (¿quién eres?) usando la ISO/IEC 2382-37."
