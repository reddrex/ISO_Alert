    relaciones:
      - {tipo: complementa, norma: "ISO/IEC/IEEE 8802"}
  - codigo: ISO/IEC/IEEE 8802
    nombre: "Redes de área local (adopción de IEEE 802)"
    resumen: "Serie de normas de redes de área local y metropolitana (LAN y MAN)."
    concepto: "redes locales (IEEE 802)"
    pregunta: "¿Cómo funcionan Ethernet y las VLAN?"
    descripcion: "Adopción como normas ISO/IEC/IEEE de los estándares IEEE 802 de redes de área local y metropolitana, como Ethernet, las VLAN o el control de acceso por puerto."
    ejemplo: "La red de una sede se segmenta en VLAN (8802-1Q) y exige autenticación 802.1X (8802-1X) para conectar un equipo a un puerto Ethernet (8802-3)."
    alcance: serie
    partes_citadas: ["1Q", "1X", "3"]
    categoria: redes
    contexto: "El temario cita 'ISO 8802' e 'ISO/IEC 802.1/802.3'. La antigua parte 1 era un informe técnico anulado; las normas IEEE 802.1 se adoptan como partes 8802-1Q (puentes y VLAN), 8802-1X (control de acceso por puerto), etc."
    naturaleza: especificacion
    temas: [50]
    claves:
      - "8802-3: Ethernet (IEEE 802.3); 8802-1Q: puentes y VLAN (IEEE 802.1Q); 8802-1X: control de acceso por puerto (IEEE 802.1X)."
      - "Corresponden a las capas física y de enlace del modelo OSI."
    relaciones:
      - {tipo: se_situa_en, norma: "ISO/IEC 7498"}
    partes_descripcion:
      "1Q": "Puentes y redes con puentes (IEEE 802.1Q): conmutación en la capa de enlace y redes de área local virtuales (VLAN)."
      "1X": "Control de acceso a la red basado en puertos (IEEE 802.1X): un equipo debe autenticarse antes de usar un puerto de la red."
      "3": "Ethernet (IEEE 802.3): capas física y de enlace de las redes Ethernet."
  - codigo: ISO/IEC 9594
