      - {tipo: amplia, norma: "ISO/IEC 19784"}
  - codigo: ISO/IEC 24709
    nombre: "Pruebas de conformidad de BioAPI"
    resumen: "Conformidad de BioAPI."
    concepto: "conformidad de BioAPI"
    pregunta: "¿Cómo compruebo que se cumple BioAPI?"
    descripcion: "Define las pruebas para comprobar que una implementación cumple la especificación BioAPI de la ISO/IEC 19784."
    ejemplo: "Antes de comprar un componente biométrico, el organismo exige que haya superado las pruebas de conformidad BioAPI de la ISO/IEC 24709."
    familia: bioapi
    alcance: serie
    categoria: biometria
    naturaleza: metodo
    temas: [81, 84]
    claves:
      - "Pruebas de conformidad con la especificación BioAPI."
    relaciones:
      - {tipo: prueba, norma: "ISO/IEC 19784"}
  - codigo: ISO/IEC 24761
    nombre: "Contexto de autenticación biométrica"
    resumen: "Información de contexto para autenticación biométrica."
    concepto: "contexto de autenticación"
    pregunta: "¿Me puedo fiar de un proceso biométrico remoto?"
    descripcion: "Define la información de contexto (ACBio) que acompaña al resultado de una autenticación biométrica hecha en un equipo remoto, para que quien la recibe pueda confiar en cómo se hizo."
    ejemplo: "Un banco que autentica con la huella en el móvil del cliente recibe, junto al resultado, información firmada que le permite confiar en cómo se hizo la comparación."
    alcance: norma
    categoria: biometria
    naturaleza: especificacion
    temas: [81, 84]
    claves:
      - "ACBio: permite al verificador comprobar la fiabilidad de un proceso biométrico realizado en un equipo remoto."
  - codigo: ISO 19092
    nombre: "Seguridad biométrica en servicios financieros"
    resumen: "Biometría en servicios financieros."
    concepto: "biometría en banca"
    pregunta: "¿Cómo uso la biometría con seguridad en servicios financieros?"
    descripcion: "Marco de seguridad para usar la biometría en la identificación y autenticación de clientes y empleados de servicios financieros."
    ejemplo: "Una entidad financiera que permite autorizar pagos con reconocimiento facial define sus controles de seguridad siguiendo la ISO 19092."
    alcance: norma
    categoria: biometria
    naturaleza: especificacion
    temas: [81, 84]
    claves:
      - "Marco de seguridad para la autenticación biométrica en servicios financieros."

