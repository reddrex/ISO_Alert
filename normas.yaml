    nombre: "CBEFF: formato común de intercambio de datos biométricos"
    resumen: "CBEFF: Common Biometric Exchange Formats Framework."
    concepto: "envoltorio CBEFF"
    pregunta: "¿Cómo se empaquetan los datos biométricos?"
    descripcion: "Define un marco para estructurar e intercambiar información biométrica de forma interoperable."
    ejemplo: "Una plantilla de huella se envía entre dos sistemas dentro de una estructura CBEFF que indica su tipo, su formato y si está cifrada."
    familia: formatos-biometricos
    alcance: serie
    categoria: biometria
    contexto: "CBEFF"
    naturaleza: especificacion
    temas: [81, 84]
    claves:
