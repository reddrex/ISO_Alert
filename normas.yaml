  # --- Redes y directorios ---
  - codigo: ISO/IEC 7498
    nombre: "Modelo de referencia OSI"
    resumen: "Modelo de referencia OSI."
    concepto: "modelo OSI"
    pregunta: "¿En qué capas se organiza la comunicación?"
    descripcion: "Define el modelo conceptual de interconexión de sistemas abiertos basado en siete capas."
    ejemplo: "Ante un fallo de comunicación, el técnico revisa capa a capa: cable y enlace (1 y 2), direccionamiento IP (3) y puertos TCP (4), siguiendo el modelo OSI."
    alcance: serie
    partes_citadas: ["1", "4"]
    categoria: redes
    contexto: "Modelo OSI (X.200) y gestión OSI (X.700)"
    naturaleza: modelo
    temas: [111]
    claves:
      - "Siete capas: física, enlace de datos, red, transporte, sesión, presentación y aplicación."
      - "Equivale a la recomendación X.200 de la UIT-T; la parte 4 (gestión OSI), a la X.700."
  - codigo: ISO/IEC 11801
