normas:
  # --- Gobierno y calidad de datos ---
  - codigo: ISO 8000
    nombre: "Calidad de datos (datos maestros, de transacciones y de ingeniería)"
    resumen: "Serie de normas sobre calidad y gestión de datos."
    concepto: "calidad de datos maestros"
    pregunta: "¿Cómo aseguro la calidad de los datos maestros?"
    descripcion: "Serie sobre la calidad de los datos: conceptos y medición, procesos de gestión de la calidad de datos y, sobre todo, calidad e intercambio de datos maestros."
    ejemplo: "Para unificar los datos de proveedores de varios departamentos, se definen reglas de calidad de datos maestros y un proceso de mejora según la ISO 8000."
    alcance: serie
    partes_citadas: ["1", "2", "8", "60", "61", "62", "100-150", "311"]
    categoria: datos
    naturaleza: modelo
    temas: [71, 76]
    claves:
      - "Partes clave: 8 (conceptos y medición), 61 (modelo de procesos de gestión de la calidad de datos) y 100 a 150 (datos maestros)."
  - codigo: ISO/IEC 38505
    nombre: "Gobierno del dato"
    resumen: "Gobierno de datos."
    concepto: "gobierno del dato"
    pregunta: "¿Cómo gobierno los datos?"
    descripcion: "Aplica los principios y el modelo Evaluar-Dirigir-Supervisar de la ISO/IEC 38500 al gobierno de los datos: cómo decide y supervisa el órgano de gobierno el uso de los datos de la organización."
    ejemplo: "Una comunidad autónoma crea una oficina del dato que define quién decide sobre cada conjunto de datos y cómo se supervisa su uso, aplicando la ISO/IEC 38505."
    familia: gobierno-ti
    alcance: serie
    partes_citadas: ["1", "TR 2"]
    categoria: datos
    naturaleza: guia
    temas: [71, 76]
    claves:
      - "Aplica el modelo de la ISO/IEC 38500 al gobierno del dato (parte 1); la parte 2 lo relaciona con la gestión de datos."
    relaciones:
      - {tipo: aplica, norma: "ISO/IEC 38500"}
  - codigo: ISO/IEC 25012
    nombre: "Modelo de calidad de datos"
    resumen: "Modelo de calidad de los datos."
    concepto: "calidad de los datos"
    pregunta: "¿Qué son datos de calidad?"
    descripcion: "Define características para describir y evaluar la calidad de los datos, como exactitud, completitud, consistencia, actualidad y accesibilidad."
    ejemplo: "Al revisar el registro de empresas, se detectan datos incompletos y desactualizados; la ISO/IEC 25012 da las características (completitud, actualidad…) para describir el problema."
    familia: square
    alcance: norma
    categoria: datos
    naturaleza: modelo
    temas: [28, 71, 76]
    claves:
      - "Quince características de calidad de los datos, clasificadas en inherentes y dependientes del sistema."
    relaciones:
      - {tipo: complementa, norma: "ISO 8000"}
  - codigo: ISO/IEC 25024
    nombre: "Medición de la calidad de los datos"
    resumen: "Medición de la calidad de los datos."
    concepto: "medir la calidad de los datos"
    pregunta: "¿Cómo mido la calidad de los datos?"
    descripcion: "Define medidas para cuantificar las características de calidad de los datos."
    ejemplo: "Para medir la completitud del registro, se calcula el porcentaje de registros con todos los campos obligatorios rellenos, con una medida de la ISO/IEC 25024."
    familia: square
    alcance: norma
    categoria: datos
    naturaleza: metodo
    temas: [71, 76]
    claves:
      - "Medidas cuantitativas para las características de la ISO/IEC 25012."
    relaciones:
      - {tipo: mide, norma: "ISO/IEC 25012"}

  # --- Gobierno de TI ---
  - codigo: ISO/IEC 38500
    nombre: "Gobierno corporativo de las TI"
    resumen: "Gobierno corporativo de las tecnologías de la información."
    concepto: "gobierno de las TI"
    pregunta: "¿Cómo dirige la alta dirección el uso de las TI?"
    descripcion: "Proporciona principios y orientación para evaluar, dirigir y supervisar el uso actual y futuro de las TI."
    ejemplo: "El comité de dirección de un ministerio evalúa las propuestas de inversión en TI, fija prioridades y supervisa que los proyectos aporten el valor esperado, siguiendo la ISO/IEC 38500."
    familia: gobierno-ti
    alcance: norma
    categoria: gobierno-ti
    naturaleza: guia
    temas: [22]
    claves:
      - "Distingue el gobierno de las TI (órgano de gobierno) de su gestión."
      - "Modelo Evaluar-Dirigir-Supervisar."
      - "Es una guía, no certificable."

  # --- Seguridad, privacidad, riesgos y continuidad ---
  - codigo: ISO/IEC 27000
    nombre: "SGSI: visión general y vocabulario"
    resumen: "Visión general y vocabulario de los sistemas de gestión de la seguridad de la información."
    concepto: "seguridad (vocabulario)"
    pregunta: "¿Qué significa cada término de la familia 27000?"
    descripcion: "Visión general de los sistemas de gestión de la seguridad de la información y términos y definiciones que usa toda la familia 27000."
    ejemplo: "Antes de redactar la política de seguridad, el equipo de un ministerio acuerda qué entiende por «activo», «amenaza» o «riesgo residual» usando las definiciones de la ISO/IEC 27000."
    familia: iso-27000
    alcance: norma
    categoria: seguridad
    naturaleza: vocabulario
    claves:
      - "Visión general y vocabulario de toda la familia; no contiene requisitos."
    relaciones:
      - {tipo: vocabulario_de, norma: "ISO/IEC 27001"}
  - codigo: ISO/IEC 27001
    nombre: "SGSI: requisitos"
    resumen: "Requisitos de un Sistema de Gestión de Seguridad de la Información (SGSI)."
    concepto: "sistema (SGSI)"
    pregunta: "¿Cómo gestiono la seguridad?"
    descripcion: "Define los requisitos para establecer, implementar, mantener y mejorar un SGSI basado en la gestión de riesgos de seguridad de la información."
    ejemplo: "Una agencia estatal implanta un SGSI para sus servicios en línea y una entidad acreditada lo audita y le concede el certificado ISO/IEC 27001."
    familia: iso-27000
    alcance: norma
    une: UNE-EN ISO/IEC 27001
    categoria: seguridad
    naturaleza: requisitos
    certificable: true
    temas: [38, 43, 47, 48, 71, 82, 105, 125]
    claves:
      - "Es la norma certificable de la familia 27000."
      - "Su Anexo A recoge los 93 controles de la ISO/IEC 27002:2022, agrupados en cuatro temas: organizativos, de personas, físicos y tecnológicos."
      - "Sigue la estructura armonizada de los sistemas de gestión (cláusulas 4 a 10, ciclo de mejora continua)."
      - "La modificación Amd 1:2024 añade la consideración del cambio climático."
  - codigo: ISO/IEC 27002
