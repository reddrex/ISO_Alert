# Normas vigiladas — extraídas del temario y validadas contra ISO Open Data
# el 2026-09-27 (ver data/validacion.json).
#
# Campos de cada norma:
#   codigo          identificador ISO sin año (lo que se busca en el dataset)
#   nombre          nombre descriptivo en español para la web (el título oficial sale del dataset ISO)
#   alcance         norma = solo ese documento | serie = todas sus partes (-1, -2…)
#   familia         id de la familia a la que pertenece (ver bloque "familias")
#   partes_citadas  partes que menciona el temario (informativo)
#   edicion_citada  año de la edición que cita el temario
#   une             código UNE cuando el temario lo cita
#   categoria       bloque temático para filtrar en la web
#   contexto        nota para humanos
#   revisar         duda pendiente; se borra al resolverla
#
# Las familias solo agrupan y dan nombre en la web: NO amplían lo que se vigila.

familias:
  - id: iso-27000
    nombre: "Familia ISO/IEC 27000 — Seguridad de la información"
  - id: square
    nombre: "SQuaRE (ISO/IEC 25000) — Requisitos y evaluación de la calidad de sistemas y software"
