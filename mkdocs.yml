site_name: Observatorio de estándares TIC
site_description: Estado y cambios de las normas ISO y UNE citadas en el temario de la oposición TIC A1. No es una fuente oficial.
site_url: https://reddrex.github.io/ISO_Alert/
copyright: "Datos: ISO Open Data (ODC-By 1.0) y BOE · No es una fuente oficial"

theme:
  name: material
  variant: classic
  language: es
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Source Sans 3
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  # Código de GoatCounter (estadísticas de visitas sin cookies): el «xxx» de xxx.goatcounter.com.
  # Vacío = sin estadísticas.
  goatcounter: "observatorio-tic"

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/estado.js

nav:
  - Inicio: index.md
  - Estándares internacionales:
      - Por ámbito: ambito.md
      - Por tema: temario/index.md
  - Estándares nacionales (UNE): une.md
  - Trucos de examen: comparativas.md
  - Estado: estado.md
  - Cambios: historial.md
  - Guía: guia.md
  - Acerca de: acerca.md
