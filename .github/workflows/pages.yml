name: Web

# Descarga los datos ISO del día, genera las páginas y publica en GitHub Pages.
# Hasta que exista la vigilancia diaria (fase 1c), no hace commit de data/.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[web]"
      - name: Datos ISO del día
        run: python -m iso_alert actualizar
      - name: Páginas generadas
        run: python -m iso_alert web
      - name: Build
        run: zensical build
      - name: Enlaces internos
        run: python scripts/comprobar_enlaces.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
