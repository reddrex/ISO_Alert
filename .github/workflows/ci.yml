name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,web]"
      - name: Tests
        run: pytest
      - name: Web con el extracto de tests
        run: |
          python -m iso_alert actualizar --fichero tests/fixtures/iso_subset.jsonl --minimo 0 --datos /tmp/datos
          python -m iso_alert web --datos /tmp/datos
          zensical build
          python scripts/comprobar_enlaces.py
