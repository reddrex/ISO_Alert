name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,web]"
      - name: Tests
        run: pytest
      - name: Informe de validación con el extracto de tests
        run: python -m iso_alert validar --fichero tests/fixtures/iso_subset.jsonl --minimo 0 --salida-json /tmp/validacion.json
      - name: Build de la web
        run: zensical build
